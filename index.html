<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Olot maslahatchilari — Kirish</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(140deg,#e8f2ff,#f6fafc);font:16px system-ui,Arial;color:#172b4d}.panel{width:min(92vw,430px);background:white;padding:32px;border-radius:20px;box-shadow:0 16px 45px #1634551c}h1{font-size:25px;margin:0 0 8px}p{color:#5c6b80;line-height:1.5}label{display:block;font-weight:600;margin:20px 0 7px}input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:9px;font-size:16px}button{width:100%;padding:14px;background:#1766d1;color:white;border:0;border-radius:9px;font-size:16px;font-weight:700;margin-top:22px}button:disabled{opacity:.6}#message{min-height:24px;font-size:14px}small{color:#65758a}.hidden{display:none}</style></head><body><main class="panel"><h1>Olot maslahatchilari</h1><p>Maktab maslahatchilari elektron platformasi</p><section id="loginSection"><form id="login"><label for="identifier">Login yoki email</label><input id="identifier" autocomplete="username" required placeholder="olot_admin yoki email"><label for="password">Parol</label><input id="password" type="password" autocomplete="current-password" required placeholder="Parol"><button id="submit">Kirish</button></form><p id="message" role="status"></p><small>Hisobingiz bo‘lmasa, administratorga murojaat qiling.</small></section><section id="dashboard" class="hidden"><p id="welcome"></p><p>Hisobingizga muvaffaqiyatli kirdingiz. Platformaning qolgan bo‘limlari keyingi bosqichda ulanadi.</p><button id="logout">Chiqish</button></section></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
// Publishable keyni index.html faylidagi quyidagi joyga qo'ying.
const SUPABASE_URL='https://dphaqrddfyyjoscroktl.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='PASTE_YOUR_PUBLISHABLE_KEY_HERE';
const message=document.getElementById('message');
let supabase;
if(SUPABASE_PUBLISHABLE_KEY.startsWith('sb_publishable_')) supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
else message.textContent='Sayt sozlanmagan: index.html fayliga Supabase publishable keyni kiriting.';
function showUser(user){document.getElementById('loginSection').classList.toggle('hidden',!!user);document.getElementById('dashboard').classList.toggle('hidden',!user);if(user)document.getElementById('welcome').textContent='Kirish bajarildi: '+(user.email||'foydalanuvchi');}
if(supabase){const {data}=await supabase.auth.getUser();showUser(data.user);supabase.auth.onAuthStateChange((_event,session)=>showUser(session?.user||null));}
document.getElementById('login').addEventListener('submit',async(e)=>{e.preventDefault();if(!supabase)return;const btn=document.getElementById('submit');btn.disabled=true;message.textContent='Tekshirilmoqda…';try{let identifier=document.getElementById('identifier').value.trim();const password=document.getElementById('password').value;let email=identifier;if(!identifier.includes('@')){if(identifier.toLowerCase()!=='olot_admin')throw new Error('Hozircha faqat olot_admin logini sozlangan.');
// Loginni mavjud Auth emailiga bog'lash; bu yerda maxfiy parol saqlanmaydi.
email='joraqulovmurodjon63@gmail.com';}
const {data,error}=await supabase.auth.signInWithPassword({email,password});if(error)throw error;message.textContent='';showUser(data.user);}catch(err){message.textContent=err.message==='Invalid login credentials'?'Login yoki parol noto‘g‘ri.':err.message;}finally{btn.disabled=false;}});
document.getElementById('logout').addEventListener('click',async()=>{if(supabase)await supabase.auth.signOut();showUser(null);document.getElementById('password').value='';});
</script></body></html>
